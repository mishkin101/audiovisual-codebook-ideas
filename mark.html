<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening Marker</title>
  <link rel="stylesheet" href="assets/style.css?v=2">
  <style>
    body { display: grid; grid-template-rows: var(--bar) 1fr var(--bar); overflow: hidden; user-select: none; -webkit-user-select: none; }
    .bar { display: flex; align-items: center; gap: var(--u2); padding: 0 var(--u2); min-width: 0; overflow: hidden; }
    header.bar { border-bottom: var(--hair) solid var(--rule); }
    footer.bar { border-top: var(--hair) solid var(--rule); }
    .bar .push { margin-left: auto; }
    .home { border: none; font: var(--t-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--mid); white-space: nowrap; flex: none; }
    .home:hover { color: var(--live); }

    .grow { flex: 1; min-width: 0; }
    .readout { display: flex; align-items: baseline; gap: var(--u2); white-space: nowrap; }
    #clock { font: var(--t-title); color: var(--live); min-width: 9ch; text-align: right; }
    #level { width: 64px; height: 6px; border: var(--hair) solid var(--rule); position: relative; flex: none; }
    #level i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bright); }
    #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #device { width: 180px; flex: none; }
    body.running.dim-bars .bar { opacity: 0.35; }
    body.running.dim-bars .bar:hover { opacity: 1; }

    #stage { position: relative; min-height: 0; cursor: crosshair; }
    body.running.locked #stage { cursor: none; }
    #score { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hint {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; line-height: 2.4;
      background: var(--void); padding: var(--u2) var(--u3); border: var(--hair) solid var(--rule);
    }

    /* keys / settings / input test panel */
    #panel { position: absolute; inset: 0; background: var(--void); display: none; flex-direction: column; }
    #panel.open { display: flex; }
    .tabs { display: flex; border-bottom: var(--hair) solid var(--rule); flex: none; }
    .tab { font: var(--t-label); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--mid); background: var(--void);
      border: none; border-right: var(--hair) solid var(--rule); height: var(--bar); padding: 0 var(--u3); cursor: pointer; display: flex; align-items: center; gap: var(--u); }
    .tab:hover { color: var(--live); }
    .tab.on { background: var(--live); color: var(--void); }
    .tabs .close { margin-left: auto; align-self: center; padding: 0 var(--u2); }
    kbd { font: var(--t-label); letter-spacing: 0.08em; border: var(--hair) solid currentColor; padding: 3px 6px; display: inline-block; min-width: 22px; text-align: center; }
    .pane { display: none; flex: 1; min-height: 0; overflow: auto; }
    .pane.on { display: grid; }

    .pane[data-pane="keys"] { grid-template-columns: repeat(3, 1fr); align-content: start; }
    .keycol { padding: var(--u3) var(--u2); border-right: var(--hair) solid var(--rule); }
    .keycol:last-child { border-right: none; }
    .keycol > .label { display: block; margin-bottom: var(--u2); color: var(--live); }
    .k { display: grid; grid-template-columns: 148px 1fr; gap: var(--u2); padding: 10px 0; border-top: var(--hair) solid var(--rule); align-items: center; }
    .k .keys { display: flex; gap: 4px; flex-wrap: wrap; color: var(--bright); }
    .k .what { color: var(--mid); }
    .rebind { background: none; border: none; padding: 0; cursor: pointer; color: var(--bright); font: inherit; }
    .rebind:hover kbd { background: var(--live); color: var(--void); border-color: var(--live); }
    .rebind.listening kbd { background: var(--live); color: var(--void); border-color: var(--live); }
    .keysfoot { grid-column: 1 / -1; display: flex; gap: var(--u3); align-items: center; padding: var(--u2); border-top: var(--hair) solid var(--rule); }

    .pane[data-pane="settings"] { grid-template-columns: minmax(0, 760px); align-content: start; padding: var(--u3) var(--u2); }
    .set { display: grid; grid-template-columns: 200px 300px 1fr; gap: var(--u3); padding: var(--u2) 0; border-top: var(--hair) solid var(--rule); align-items: center; }
    .set .what { color: var(--dim); font: var(--t-data); line-height: 1.5; }
    .seg { display: flex; }
    .seg .btn + .btn { border-left: none; }
    .slider { display: flex; align-items: center; gap: var(--u2); }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 200px; height: 20px; background: transparent; margin: 0; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--mid); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 20px; background: var(--live); margin-top: -9.5px; border: none; }
    input[type="range"]::-moz-range-track { height: 1px; background: var(--mid); }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 20px; background: var(--live); border: none; border-radius: 0; }

    .pane[data-pane="test"] { grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr; }
    .pane[data-pane="test"] .intro { grid-column: 1 / -1; padding: var(--u3) var(--u2); border-bottom: var(--hair) solid var(--rule); }
    .cell { border-right: var(--hair) solid var(--rule); padding: var(--u3) var(--u2); display: flex; flex-direction: column; gap: var(--u2); min-width: 0; }
    .cell:last-child { border-right: none; }
    .big { font: var(--t-display); color: var(--dim); }
    .big.hot { color: var(--live); }
    .meter { height: 120px; border: var(--hair) solid var(--rule); position: relative; }
    .meter i { position: absolute; left: 0; right: 0; bottom: 50%; height: 1px; background: var(--live); }
    .meter::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: var(--hair) dashed var(--rule); }
    #keysBtn kbd { border: none; padding: 0; min-width: 0; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="home" href="index.html" title="Back to the gallery">← Gallery</a>
    <input class="field" id="title" placeholder="Title" autocomplete="off" style="width: 22%">
    <input class="field" id="artist" placeholder="Artist" autocomplete="off" style="width: 16%">
    <input class="field" id="moodBefore" placeholder="Mood before" autocomplete="off" style="width: 16%">
    <button class="btn" id="privateBtn" title="Private sessions are saved to private/, which git ignores">Private</button>
    <div class="readout push">
      <span class="label" id="passLabel">No pass</span>
      <span class="label">E <span class="data" id="energyOut">0.50</span></span>
      <span id="clock">00:00.0</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="score"></canvas>
    <div id="hint" class="label"></div>

    <div id="panel">
      <div class="tabs">
        <button class="tab" data-tab="keys">Keys <kbd data-keyof="keys"></kbd></button>
        <button class="tab" data-tab="settings">Settings <kbd data-keyof="settings"></kbd></button>
        <button class="tab" data-tab="test">Input test <kbd data-keyof="test"></kbd></button>
        <button class="btn close" id="closePanel">Close <kbd style="border:none;padding:0">Esc</kbd></button>
      </div>

      <div class="pane" data-pane="keys" id="keysPane"></div>

      <div class="pane" data-pane="settings" id="settingsPane"></div>

      <div class="pane" data-pane="test">
        <div class="intro"><span class="label">Try each gesture, then try them at the same time. Nothing is recorded while this tab is open.</span></div>
        <div class="cell">
          <span class="label">Two-finger swipe</span>
          <div class="meter"><i id="tSwipeBar"></i></div>
          <span class="data" id="tSwipe">0 events</span>
        </div>
        <div class="cell">
          <span class="label">Space · tap / hold</span>
          <span class="big" id="tClickState">UP</span>
          <span class="data" id="tClick">0 presses · last hold 0.00s</span>
        </div>
        <div class="cell">
          <span class="label">Together</span>
          <span class="big" id="tBothState">—</span>
          <span class="data" id="tBoth">swipe while space held: 0<br>space while swiping: 0</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="bar">
    <span class="label">Source</span>
    <button class="btn" id="fileBtn">File</button>
    <button class="btn" id="inputBtn">Input</button>
    <select class="field" id="device" hidden></select>
    <button class="btn" id="systemBtn">System</button>
    <div id="level" title="Input level"><i></i></div>
    <span class="label grow" id="status"></span>
    <input class="field" id="moodAfter" placeholder="Mood after" autocomplete="off" style="width: 14%">
    <button class="btn" id="startBtn">Start</button>
    <button class="btn" id="stopBtn" disabled>Stop</button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn" id="settingsBtn" title="Settings (,)">Settings</button>
    <button class="btn" id="keysBtn" title="Keys"><kbd data-keyof="keys"></kbd> Keys</button>
    <input type="file" id="fileInput" accept="audio/*" hidden>
  </footer>

<script src="assets/journal.js?v=2"></script>
<script src="assets/score.js?v=2"></script>
<script>
(function () {
  const J = window.Journal;
  const KEY = "journal.marker.current";
  const RATE = 50;              // waveform samples per second
  const SWIPE_PER_UNIT = 800;   // pixels of scroll for the full 0-1 energy range at sensitivity 1

  // Settings belong to this browser, not to a session.
  const SETTINGS = "journal.marker.settings";
  const DEFAULTS = { invert: false, sensitivity: 1, holdMs: 300, startEnergy: 0.5, hideCursor: true, dimBars: true };
  const settings = Object.assign({}, DEFAULTS, J.store.get(SETTINGS) || {});

  // Key bindings: action -> KeyboardEvent.code (the physical key, whatever the keyboard layout).
  const ACTIONS = [
    { id: "start", group: "Listen", what: "Start a pass · new pass", key: "Enter" },
    { id: "mark", group: "Listen", what: "Tap: instant mark · hold: range", key: "Space" },
    { id: "energyUp", group: "Listen", what: "Energy up", key: "ArrowUp" },
    { id: "energyDown", group: "Listen", what: "Energy down", key: "ArrowDown" },
    { id: "stop", group: "Listen", what: "Stop the pass", key: "KeyS" },
    { id: "export", group: "Session", what: "Export session.json", key: "KeyE" },
    { id: "file", group: "Session", what: "Source: audio file", key: "KeyF" },
    { id: "private", group: "Session", what: "Private on / off", key: "KeyP" },
    { id: "zoomIn", group: "View", what: "Zoom in", key: "Equal" },
    { id: "zoomOut", group: "View", what: "Zoom out", key: "Minus" },
    { id: "zoomFit", group: "View", what: "Fit the whole song", key: "Digit0" },
    { id: "keys", group: "View", what: "This list", key: "Slash" },
    { id: "settings", group: "View", what: "Settings", key: "Comma" },
    { id: "test", group: "View", what: "Input test", key: "KeyT" },
    { id: "invert", group: "View", what: "Flip swipe direction", key: "KeyI" }
  ];
  const DEFAULT_KEYS = Object.fromEntries(ACTIONS.map((a) => [a.id, a.key]));
  settings.keys = Object.assign({}, DEFAULT_KEYS, settings.keys || {});
  const KEY_NAMES = { Space: "Space", Enter: "Enter", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", Slash: "?", Comma: ",", Period: ".",
    Equal: "+", Minus: "−", Semicolon: ";", Quote: "'", Backquote: "`", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Tab: "Tab", Backspace: "⌫", Delete: "Del" };
  function keyName(code) {
    if (!code) return "—";
    if (KEY_NAMES[code]) return KEY_NAMES[code];
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit\d$/.test(code)) return code.slice(5);
    if (/^Numpad/.test(code)) return "Num " + code.slice(6);
    return code;
  }
  const keyOf = (id) => keyName(settings.keys[id]);
  const actionFor = (code) => Object.keys(settings.keys).find((id) => settings.keys[id] === code);
  const $ = (id) => document.getElementById(id);

  // ---------- session state ----------
  function blankSession() {
    return {
      id: "", date: J.today(), private: false,
      track: { title: "", artist: "", source: "spotify", url: "", duration_s: null },
      context: { time_of_day: "", place: "", mood_before: "", mood_after: "" },
      passes: [], moments: [], sketches: [], reflection: "",
      waveform: { source: null, rate_hz: RATE, peaks: [] },
      audio_features: null,
      _marker: { running: false, startMs: null, energy: settings.startEnergy, nextN: 1, lastT: 0 }
    };
  }
  let s = J.store.get(KEY) || blankSession();
  if (!s.waveform) s.waveform = { source: null, rate_hz: RATE, peaks: [] };
  if (typeof s._marker.energy !== "number" || s._marker.energy > 1) s._marker.energy = settings.startEnergy;
  if (s._marker.invert) { settings.invert = true; delete s._marker.invert; }   // older sessions kept this per session

  // A reload ends a running pass where it was last saved (the audio can't survive a reload).
  if (s._marker.running) {
    const p = s.passes[s.passes.length - 1];
    if (p) p.ended_s = s._marker.lastT;
    s._marker.running = false;
  }

  const audio = { mode: "none", el: new Audio(), ctx: null, analyser: null, stream: null, buf: null, level: 0 };
  let hold = null;          // { t, range, timer }
  let recordFrom = 0;       // first waveform index this pass may write (live mode)
  let dirty = true;
  let lockLost = false;     // cursor capture was held during this pass and released (Esc)

  const round = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const pass = () => s.passes[s.passes.length - 1];

  function save() {
    s.id = J.sessionId(s.date, s.track);
    s._marker.lastT = round(now());
    J.store.set(KEY, s);
  }

  function now() {
    if (!s._marker.running) return pass() ? pass().ended_s || 0 : 0;
    if (audio.mode === "file") return audio.el.currentTime;
    return (Date.now() - s._marker.startMs) / 1000;
  }

  function setStatus(text) { $("status").textContent = text; }

  // ---------- audio sources ----------
  function ensureCtx() {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }

  function stopStream() {
    if (audio.stream) audio.stream.getTracks().forEach((t) => t.stop());
    audio.stream = null; audio.analyser = null; audio.level = 0;
  }

  async function loadFile(file) {
    stopStream();
    setStatus("Reading " + file.name + "…");
    try {
      const ctx = ensureCtx();
      const buffer = await ctx.decodeAudioData(await file.arrayBuffer());
      const n = Math.ceil(buffer.duration * RATE), per = buffer.sampleRate / RATE;
      const chans = [...Array(buffer.numberOfChannels).keys()].map((c) => buffer.getChannelData(c));
      const peaks = new Array(n);
      for (let i = 0; i < n; i++) {
        let m = 0;
        const a = Math.floor(i * per), b = Math.min(chans[0].length, Math.floor((i + 1) * per));
        for (const ch of chans) for (let j = a; j < b; j += 4) { const v = Math.abs(ch[j]); if (v > m) m = v; }
        peaks[i] = round(m, 3);
      }
      s.waveform = { source: "file", rate_hz: RATE, peaks };
      s.track.duration_s = round(buffer.duration);
      s.track.source = "local";
      if (!s.track.title) { s.track.title = file.name.replace(/\.[^.]+$/, ""); $("title").value = s.track.title; }
      audio.el.src = URL.createObjectURL(file);
      audio.mode = "file";
      setStatus("File · " + file.name + " · " + J.formatTime(buffer.duration));
    } catch (e) {
      setStatus("Couldn't read that file as audio.");
    }
    save(); renderBars(); dirty = true;
  }

  function attachStream(stream, label) {
    stopStream();
    const ctx = ensureCtx();
    audio.stream = stream;
    audio.analyser = ctx.createAnalyser();
    audio.analyser.fftSize = 2048;
    audio.buf = new Float32Array(audio.analyser.fftSize);
    ctx.createMediaStreamSource(stream).connect(audio.analyser);
    audio.mode = "live";
    if (s.track.source === "local") s.track.source = "spotify";
    setStatus(label);
    renderBars();
  }

  const rawAudio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };

  async function startInput(deviceId) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { ...rawAudio, deviceId: { exact: deviceId } } : rawAudio });
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
      const sel = $("device");
      sel.innerHTML = "";
      devices.forEach((d) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || "Input"; sel.appendChild(o); });
      const active = stream.getAudioTracks()[0].getSettings().deviceId;
      if (active) sel.value = active;
      sel.hidden = false;
      attachStream(stream, "Input · " + (stream.getAudioTracks()[0].label || "microphone"));
    } catch (e) {
      setStatus("No access to audio input.");
    }
  }

  async function startSystem() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: rawAudio, systemAudio: "include" });
      if (!stream.getAudioTracks().length) {
        stream.getTracks().forEach((t) => t.stop());
        setStatus("No audio was shared. In the share dialog, turn on audio sharing.");
        return;
      }
      $("device").hidden = true;
      attachStream(stream, "System audio");
    } catch (e) {
      setStatus("System audio capture isn't available here.");
    }
  }

  // Live capture: read the analyser each frame, keep the loudest sample per bucket.
  function sampleLive() {
    if (!audio.analyser) return;
    audio.analyser.getFloatTimeDomainData(audio.buf);
    let m = 0;
    for (let i = 0; i < audio.buf.length; i++) { const v = Math.abs(audio.buf[i]); if (v > m) m = v; }
    audio.level = m;
    if (!s._marker.running) return;
    if (!s.waveform.peaks.length) s.waveform.rate_hz = RATE;
    const idx = Math.floor(now() * s.waveform.rate_hz), peaks = s.waveform.peaks;
    if (idx < recordFrom) return;
    while (peaks.length < idx) peaks.push(0);
    peaks[idx] = round(Math.max(peaks[idx] || 0, m), 3);
    s.waveform.source = "live";
    dirty = true;
  }

  // ---------- passes ----------
  function startPass() {
    if (s._marker.running || test.open) return;
    if (panelTab) closePanel();
    const t0 = Date.now();
    s.passes.push({ n: s.passes.length + 1, started: J.clockTime(t0), ended_s: null, energy_log: [] });
    if (!s.context.time_of_day) {
      const h = new Date(t0).getHours();
      s.context.time_of_day = h < 5 ? "night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
    }
    s._marker.running = true;
    s._marker.startMs = t0;
    recordFrom = s.waveform.source === "live" ? s.waveform.peaks.length : 0;
    if (audio.mode === "file") { audio.el.currentTime = 0; audio.el.play(); }
    pass().energy_log.push({ t_s: 0, energy: round(s._marker.energy, 3) });
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    lock();
    save(); renderBars(); dirty = true;
  }

  function stopPass() {
    if (!s._marker.running) return;
    if (hold) endHold();
    pass().ended_s = round(now());
    s._marker.running = false;
    if (audio.mode === "file") audio.el.pause();
    if (document.pointerLockElement) document.exitPointerLock();
    lockLost = false;
    save(); renderBars(); dirty = true;
  }

  function lock() {
    if (!settings.hideCursor) return;
    try { const r = $("stage").requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  }

  // ---------- marks ----------
  function addMark(kind, t, tEnd) {
    s.moments.push(J.newMoment({
      n: s._marker.nextN++, pass: pass().n, kind,
      t_s: round(t), t_end_s: tEnd == null ? null : round(tEnd),
      energy: round(s._marker.energy, 2)
    }));
    save(); renderBars(); dirty = true;
  }

  function beginHold() {
    if (!s._marker.running || hold) return;
    hold = { t: now(), range: false };
    hold.timer = setTimeout(() => { if (hold) { hold.range = true; dirty = true; } }, settings.holdMs);
  }

  function endHold() {
    if (!hold) return;
    clearTimeout(hold.timer);
    const h = hold; hold = null;
    if (h.range) addMark("range", h.t, now());
    else addMark("tap", h.t, null);
  }

  // ---------- energy ----------
  let energySaveTimer = null;
  function nudgeEnergy(delta) {
    s._marker.energy = clamp(s._marker.energy + delta);
    if (s._marker.running) {
      const t = round(now()), log = pass().energy_log, last = log[log.length - 1];
      const e = round(s._marker.energy, 3);
      if (last && t - last.t_s < 0.1) last.energy = e; else log.push({ t_s: t, energy: e });
    }
    $("energyOut").textContent = s._marker.energy.toFixed(2);
    dirty = true;
    clearTimeout(energySaveTimer);
    energySaveTimer = setTimeout(save, 400);
  }

  // ---------- drawing ----------
  const score = Score.create($("score"));
  function resize() { score.resize(); dirty = true; }
  function draw() {
    const current = pass() ? pass().n : 0;
    score.draw({
      session: s, t: now(), current, running: s._marker.running,
      hold: hold && hold.range ? { t: hold.t } : null,
      energyNow: s._marker.energy, playhead: !!current, follow: s._marker.running
    });
  }

  // ---------- chrome ----------
  function renderBars() {
    const running = s._marker.running, p = pass(), locked = !!document.pointerLockElement;
    document.body.classList.toggle("running", running);
    document.body.classList.toggle("locked", locked);
    $("passLabel").textContent = p ? "Pass " + String(p.n).padStart(2, "0") + (running ? " · rec" : "") : "No pass";
    $("startBtn").textContent = s.passes.length ? "New pass" : "Start";
    $("startBtn").disabled = running;
    $("stopBtn").disabled = !running;
    $("stopBtn").classList.toggle("on", running);
    $("privateBtn").classList.toggle("on", !!s.private);
    $("fileBtn").classList.toggle("on", audio.mode === "file");
    $("inputBtn").classList.toggle("on", audio.mode === "live" && !$("device").hidden);
    $("systemBtn").classList.toggle("on", audio.mode === "live" && $("device").hidden);
    $("energyOut").textContent = s._marker.energy.toFixed(2);
    $("clock").textContent = J.formatTime(now());
    const hint = $("hint");
    if (running && lockLost) hint.innerHTML = "Click to hide the cursor again<br>Space still marks · S to stop";
    else if (!running && !s.passes.length) hint.innerHTML = "Choose a source below<br>" + keyOf("start") + " start · " + keyOf("mark") + " mark · hold " + keyOf("mark") + " range<br>two-finger swipe energy<br>" + keyOf("keys") + " keys and settings";
    else hint.innerHTML = "";
    hint.style.display = hint.innerHTML ? "" : "none";
  }

  // ---------- input test ----------
  const test = { open: false, swipes: 0, swipeSum: 0, presses: 0, both1: 0, both2: 0, down: false, downAt: 0, lastWheel: 0, lastHold: 0 };
  // ---------- panel: keys / settings / input test ----------
  let panelTab = null;
  function openPanel(tab) {
    if (panelTab === tab) return closePanel();
    panelTab = tab;
    test.open = tab === "test";
    if (test.open) stopPass();
    if (tab === "settings") renderSettings();
    if (tab === "keys") renderKeys();
    renderPanel();
  }
  function closePanel() { panelTab = null; test.open = false; capturing = null; renderPanel(); }
  function renderPanel() {
    $("panel").classList.toggle("open", !!panelTab);
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === panelTab));
    document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.dataset.pane === panelTab));
    $("keysBtn").classList.toggle("on", panelTab === "keys");
    $("settingsBtn").classList.toggle("on", panelTab === "settings");
  }

  // ---------- key bindings ----------
  let capturing = null;   // action id waiting for a new key
  function renderKeys() {
    const row = (keysHtml, what) => '<div class="k"><span class="keys">' + keysHtml + '</span><span class="what">' + what + "</span></div>";
    const fixed = {
      Listen: [row('<span class="label">two-finger swipe</span>', "Energy, 0.00 to 1.00")],
      Session: [row("<kbd>Esc</kbd>", "Show the cursor · close this panel")],
      View: [row('<span class="label">pinch</span>', "Zoom the timeline")]
    };
    const col = (group) => '<div class="keycol"><span class="label">' + group + "</span>" +
      ACTIONS.filter((a) => a.group === group).map((a) => row(
        '<button class="rebind' + (capturing === a.id ? " listening" : "") + '" data-rebind="' + a.id + '" title="Click, then press a new key">' +
        "<kbd>" + (capturing === a.id ? "Press a key" : J.escape(keyOf(a.id))) + "</kbd></button>" +
        (a.id === "mark" ? '<span class="label">hold</span>' : ""), a.what)).join("") +
      fixed[group].join("") + "</div>";
    $("keysPane").innerHTML = col("Listen") + col("Session") + col("View") +
      '<div class="keysfoot"><button class="btn" id="resetKeys">Restore default keys</button>' +
      '<span class="label dimmed">' + (capturing ? "Press the new key · Esc to cancel" : "Click any key to change it") + "</span></div>";
    $("keysPane").querySelectorAll("[data-rebind]").forEach((b) => b.onclick = () => { capturing = capturing === b.dataset.rebind ? null : b.dataset.rebind; renderKeys(); });
    $("resetKeys").onclick = () => { settings.keys = Object.assign({}, DEFAULT_KEYS); capturing = null; saveSettings(); setStatus("Default keys restored"); };
    document.querySelectorAll("[data-keyof]").forEach((k) => k.textContent = keyOf(k.dataset.keyof));
  }
  const MODIFIERS = ["ShiftLeft", "ShiftRight", "MetaLeft", "MetaRight", "AltLeft", "AltRight", "ControlLeft", "ControlRight", "CapsLock", "Fn"];
  function finishCapture(code) {
    const id = capturing; capturing = null;
    const other = actionFor(code);
    if (other && other !== id) {
      settings.keys[other] = settings.keys[id];           // swap so no action loses its key
      setStatus(keyName(code) + " now " + ACTIONS.find((a) => a.id === id).what.toLowerCase() + " · " + ACTIONS.find((a) => a.id === other).what + " moved to " + keyName(settings.keys[other]));
    } else setStatus(keyName(code) + " · " + ACTIONS.find((a) => a.id === id).what);
    settings.keys[id] = code;
    saveSettings();
  }

  function saveSettings() { J.store.set(SETTINGS, settings); applySettings(); renderSettings(); renderKeys(); renderBars(); }
  function applySettings() { document.body.classList.toggle("dim-bars", settings.dimBars); }
  function renderSettings() {
    const seg = (key, options) => '<div class="seg">' + options.map(([v, text]) =>
      '<button class="btn' + (settings[key] === v ? " on" : "") + '" data-set="' + key + '" data-val="' + JSON.stringify(v).replace(/"/g, "&quot;") + '">' + text + "</button>").join("") + "</div>";
    const slider = (key, min, max, step, fmt) => '<div class="slider"><input type="range" data-range="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + settings[key] + '">' +
      '<span class="data" id="val-' + key + '">' + fmt(settings[key]) + "</span></div>";
    const row = (name, control, what) => '<div class="set"><span class="label">' + name + "</span>" + control + '<span class="what">' + what + "</span></div>";
    $("settingsPane").innerHTML = "<div>" +
      row("Swipe direction", seg("invert", [[false, "Natural"], [true, "Inverted"]]), "Natural: swiping up raises energy (with macOS natural scrolling). Also <kbd>" + J.escape(keyOf("invert")) + "</kbd>.") +
      row("Swipe sensitivity", slider("sensitivity", 0.25, 3, 0.25, (v) => (+v).toFixed(2) + "×"), "How far one swipe moves energy. Higher = less finger travel.") +
      row("Hold for range after", seg("holdMs", [[150, "150 ms"], [300, "300 ms"], [500, "500 ms"]]), "How long space must be held before a tap becomes a range.") +
      row("Starting energy", slider("startEnergy", 0, 1, 0.05, (v) => (+v).toFixed(2)), "Energy level when a new session begins.") +
      row("Hide cursor in a pass", seg("hideCursor", [[true, "On"], [false, "Off"]]), "Hides and captures the cursor while listening. Esc shows it again.") +
      row("Fade bars in a pass", seg("dimBars", [[true, "On"], [false, "Off"]]), "Dims the header and footer while listening.") +
      '<div class="set"><span class="label">Reset</span><button class="btn" id="resetSettings">Restore defaults</button><span class="what">Settings are saved in this browser.</span></div></div>';
    $("settingsPane").querySelectorAll("[data-set]").forEach((b) => b.onclick = () => { settings[b.dataset.set] = JSON.parse(b.dataset.val); saveSettings(); });
    $("settingsPane").querySelectorAll("[data-range]").forEach((r) => {
      const key = r.dataset.range, fmt = key === "sensitivity" ? (v) => (+v).toFixed(2) + "×" : (v) => (+v).toFixed(2);
      r.addEventListener("input", () => { settings[key] = +r.value; $("val-" + key).textContent = fmt(r.value); J.store.set(SETTINGS, settings); });
    });
    $("resetSettings").onclick = () => { Object.assign(settings, DEFAULTS); saveSettings(); };
  }
  function renderTest() {
    $("tSwipe").textContent = test.swipes + " events · Δ " + Math.round(test.swipeSum);
    $("tSwipeBar").style.bottom = (50 + Math.max(-50, Math.min(50, test.swipeSum / 8))) + "%";
    $("tClickState").textContent = test.down ? "DOWN" : "UP";
    $("tClickState").classList.toggle("hot", test.down);
    $("tClick").textContent = test.presses + " presses · last hold " + test.lastHold.toFixed(2) + "s";
    $("tBoth").innerHTML = "swipe while space held: " + test.both1 + "<br>space while swiping: " + test.both2;
  }
  function flash(id, text) {
    const el = $(id); el.textContent = text; el.classList.add("hot");
    clearTimeout(el._t); el._t = setTimeout(() => { el.classList.remove("hot"); el.textContent = "—"; }, 500);
  }

  // ---------- wiring ----------
  const fields = { title: ["track", "title"], artist: ["track", "artist"], moodBefore: ["context", "mood_before"], moodAfter: ["context", "mood_after"] };
  Object.entries(fields).forEach(([id, [grp, key]]) => {
    const el = $(id); el.value = s[grp][key] || "";
    el.addEventListener("input", () => { s[grp][key] = el.value; save(); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") el.blur(); });
  });
  $("privateBtn").onclick = () => { s.private = !s.private; save(); renderBars(); };
  $("fileBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ""; };
  $("inputBtn").onclick = () => startInput();
  $("device").onchange = (e) => startInput(e.target.value);
  $("systemBtn").onclick = startSystem;
  $("startBtn").onclick = startPass;
  $("stopBtn").onclick = stopPass;
  $("keysBtn").onclick = () => openPanel("keys");
  $("settingsBtn").onclick = () => openPanel("settings");
  $("closePanel").onclick = closePanel;
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => openPanel(t.dataset.tab));
  // The file is named after the title. In Chrome a save dialog lets you change the name and pick the folder.
  function exportName() {
    const name = (s.track.title || "").trim().replace(/[\/\\:*?"<>|]+/g, "-").replace(/\s+/g, " ").slice(0, 80);
    return (name || "session") + ".json";
  }
  async function exportSession() {
    if (!s.moments.length && !s.passes.length) return setStatus("Nothing to export yet");
    const out = JSON.parse(JSON.stringify(s)); delete out._marker; out.id = J.sessionId(out.date, out.track);
    const text = JSON.stringify(out, null, 2), name = exportName();
    if (!s.track.title) setStatus("Tip: add a title first and the file will be named after it");
    if (window.showSaveFilePicker) {
      if (document.pointerLockElement) document.exitPointerLock();
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "Session", accept: { "application/json": [".json"] } }] });
        const w = await handle.createWritable(); await w.write(text); await w.close();
        return setStatus("Exported " + handle.name + " · open it in the Editor, or save it there into the repo");
      } catch (e) {
        if (e.name === "AbortError") return setStatus("Export cancelled");
      }
    }
    J.download(name, text);
    setStatus("Exported " + name + " to Downloads · open it in the Editor, or save it there into the repo");
  }
  $("exportBtn").onclick = exportSession;
  $("resetBtn").onclick = () => {
    if (s.moments.length && !confirm("Clear this session? Export it first if you want to keep it.")) return;
    stopPass();
    const keepFile = audio.mode === "file" ? { w: s.waveform, d: s.track.duration_s } : null;
    s = blankSession();
    if (keepFile) { s.waveform = keepFile.w; s.track.duration_s = keepFile.d; s.track.source = "local"; }
    J.store.remove(KEY);
    Object.keys(fields).forEach((id) => $(id).value = "");
    setStatus(""); renderBars(); dirty = true;
  };

  // Trackpad = energy only. Marks live on the keyboard so a stray click never makes one.
  const stage = $("stage");
  window.addEventListener("wheel", (e) => {
    if (e.target instanceof Element && e.target.closest("select")) return;
    e.preventDefault();
    if (e.ctrlKey) {                             // pinch zooms the score around the playhead
      if (!test.open) { score.zoom(Math.exp(-e.deltaY * 0.01), pass() ? score.toX(now()) : undefined); dirty = true; }
      return;
    }
    const d = (e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * (settings.invert ? -1 : 1);
    if (test.open) {
      test.swipes++; test.swipeSum += d; test.lastWheel = performance.now();
      if (test.down) test.both1++;
      renderTest(); return;
    }
    nudgeEnergy(d * settings.sensitivity / SWIPE_PER_UNIT);
  }, { passive: false });

  stage.addEventListener("mousedown", () => {
    if (s._marker.running && lockLost) { lockLost = false; lock(); renderBars(); }   // click after Esc re-captures the cursor
  });
  stage.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault());   // Safari: no page zoom
  document.addEventListener("pointerlockchange", () => {
    if (!document.pointerLockElement && s._marker.running) lockLost = true;
    renderBars();
  });

  const typing = (e) => e.target instanceof Element && e.target.matches("input, select, textarea");
  document.addEventListener("keydown", (e) => {
    if (typing(e) || e.metaKey || e.ctrlKey) return;
    if (capturing) {
      e.preventDefault();
      if (e.code === "Escape") { capturing = null; renderKeys(); return; }
      if (!MODIFIERS.includes(e.code)) finishCapture(e.code);
      return;
    }
    if (e.code === "Escape") { if (panelTab) closePanel(); return; }
    const action = actionFor(e.code);
    if (!action) return;
    e.preventDefault();
    const zoomAt = () => pass() ? score.toX(now()) : undefined;
    switch (action) {
      case "mark":
        if (e.repeat) return;
        if (test.open) {
          test.down = true; test.downAt = performance.now(); test.presses++;
          if (performance.now() - test.lastWheel < 200) { test.both2++; flash("tBothState", "BOTH"); }
          renderTest();
        } else beginHold();
        break;
      case "start": if (!s._marker.running) startPass(); break;
      case "stop": stopPass(); break;
      case "energyUp": nudgeEnergy(0.05); break;
      case "energyDown": nudgeEnergy(-0.05); break;
      case "export": exportSession(); break;
      case "file": if (!s._marker.running) $("fileInput").click(); break;
      case "private": s.private = !s.private; save(); renderBars(); setStatus(s.private ? "Private · will be saved to private/" : "Public"); break;
      case "zoomIn": score.zoom(2, zoomAt()); dirty = true; break;
      case "zoomOut": score.zoom(0.5, zoomAt()); dirty = true; break;
      case "zoomFit": score.fit(); dirty = true; break;
      case "keys": openPanel("keys"); break;
      case "settings": openPanel("settings"); break;
      case "test": openPanel("test"); break;
      case "invert": settings.invert = !settings.invert; saveSettings(); setStatus("Swipe direction " + (settings.invert ? "inverted" : "natural")); break;
    }
  });
  document.addEventListener("keyup", (e) => {
    if (typing(e) || capturing || e.code !== settings.keys.mark) return;
    e.preventDefault();
    if (test.open) { if (test.down) { test.down = false; test.lastHold = (performance.now() - test.downAt) / 1000; renderTest(); } }
    else endHold();
  });
  audio.el.addEventListener("ended", stopPass);

  new ResizeObserver(resize).observe($("score"));
  applySettings();
  renderKeys();
  renderBars();
  setStatus(s.waveform.peaks.length ? "Waveform kept from last time · choose a source to continue" : "File for local audio · Input or System for Spotify");

  let lastSave = 0;
  (function frame(ts) {
    if (audio.mode === "live") sampleLive();
    $("level").firstChild.style.width = Math.min(100, audio.level * 140) + "%";
    if (s._marker.running) {
      dirty = true;
      $("clock").textContent = J.formatTime(now());
      if (ts - lastSave > 1000) { save(); lastSave = ts; }
    }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  })(0);
})();
</script>
</body>
</html>
